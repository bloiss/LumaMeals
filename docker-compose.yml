services:
  postgres:
    image: postgres:16-alpine
    container_name: lumeameals-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumeameals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumeameals}
      POSTGRES_DB: ${POSTGRES_DB:-lumeameals}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumeameals}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
